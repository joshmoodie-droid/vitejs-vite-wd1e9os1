name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    # Points at the **staging** Supabase project (qliapjpxwlcnyjfwfdor), never
    # production — CI reads and (in the RLS test) writes to it. Its schema is a
    # copy of prod (see supabase/migrations/0000_baseline.sql + supabase/seed.sql).
    # The publishable key is designed to be public: it ships in every browser
    # bundle and RLS is the security boundary. Set at job level so the Playwright
    # webServer's own `npm run build` inherits it too.
    env:
      VITE_SUPABASE_URL: https://qliapjpxwlcnyjfwfdor.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_FslekN5xomot4WyDVo6cUw_DX-xmul-

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        # Fails only on critical for now. The remaining high is a Vite
        # dev-server advisory that needs the Vite 8 major bump (Dependabot
        # will open that PR); raise this to --audit-level=high once it lands.
        run: npm audit --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Drop the runner's Google Chrome apt source
        # `playwright install --with-deps` runs `apt-get update`; the runner
        # image pre-adds dl.google.com/linux/chrome, which periodically serves a
        # mismatched Packages index and fails the whole step. We don't need it —
        # Playwright ships its own Chromium.
        run: sudo rm -f /etc/apt/sources.list.d/*google-chrome*

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e

      - name: RLS regression test
        run: npm run test:rls

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
